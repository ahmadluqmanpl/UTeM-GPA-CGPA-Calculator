packages:
  - "."

# Native packages Wrangler needs when this project is installed with pnpm.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Security remediation for build-time (wrangler/miniflare) transitive advisories.
overrides:
  fast-uri: ">=3.1.4"
  brace-expansion: ">=5.0.8"
  tar: ">=7.5.21"
  sharp: ">=0.35.0"
